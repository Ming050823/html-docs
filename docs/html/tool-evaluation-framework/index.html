ack、ERP 或內部工單系統？","是否支援企業身分驗證（SSO / LDAP / Azure AD）？","資料傳輸是否能在內網或專屬 VPC 完成，無需手動搬移？"]},{id:"effort",title:"省多少心力",shortDesc:"扣除人工複核、提示詞調校與錯誤修復後的「淨省下時間」",detailTitle:"真實投資報酬率：淨省下的跨部門心力 (Net Effort Saved)",detailBody:"評估新工具不能只看生成初稿的幾秒鐘，必須扣除：撰寫提示詞、逐行檢查業務正確性、排版修正、以及工程人員維護膠水代碼的時間。能實質降低各部門心智負擔的工具才具備引進價值。",metrics:[{label:"大幅縮減人工複核工時",value:87},{label:"降低認知負荷與操作摩擦",value:91},{label:"跨部門協作週轉效率",value:86}],checklist:["員工複查與修正 AI 產出內容的時間是否少於原處理時間的 30%？","跨部門新進人員是否能在半天內無痛上手？","工具上線後，IT 部門是否不需要天天被客服工單淹沒？"]}],calcBtn:"開啟跨部門心力試算器",calcTitle:"跨部門心力節省與 ROI 試算器",calcUsers:"使用該工具的部門總人數",calcHours:"每人每週原本在該任務耗費的工時 (小時)",calcEfficiency:"工具導入後的工時節省比例",calcHourlyCost:"平均時薪成本預估 (USD/hr)",calcWeeklyHoursSaved:"全部門每週淨省下工時",calcMonthlyDollarSaved:"預估每月為公司節省成本",calcUnitHours:"小時/週",calcUnitPeople:"人",calcVerdictGood:"✅ 效益顯著：此工具能為組織釋放龐大產能與心力！",calcVerdictLow:"⚠️ 效益偏低：省下的心力不足以抵銷導入與跨部門溝通成本。"},s2:{title:"個人 VS 公司",leftHeader:"個人",rightHeader:"公司",vsBadge:"VS",subtitle:"維護成本與長期營運的真正硬仗",scenarioPrompt:"點擊下方任一項目，檢視「自用小腳本」與「企業級系統」的本質差異：",leftPoints:[{id:"p1",title:"解決痛點",pairId:"c1",summary:"只解決自己手頭上的特定瓶頸，只要跑得通就算成功",detail:"個人開發只聚焦於當下自己的問題（如：自動抓取今日匯率或批次重命名）。完全不用顧慮「若其他部門同仁輸入全形字元或日語會不會炸裂」，因為使用者永遠只有自己一人。",codeBadge:"Hardcode 本機檔案路徑與個人 API Key，快狠準即可。"},{id:"p2",title:"最猛工具",pairId:"c2",summary:"無拘無束嘗鮮最新模型與前沿框架，不怕破壞性更新",detail:"昨天在 GitHub 上發布的實驗性開源模型，今天就能直接導入自己的腳本。就算作者下個月停止維護或 API 格式大改，自己花十分鐘修兩行就搞定，無需層層資安簽核。",codeBadge:"隨意使用 npm / pip 的 nightly 或 0.0.1-alpha 套件。"},{id:"p3",title:"無需討好",pairId:"c3",summary:"介面醜、終端機黑底白字都無妨，自己看得懂就好",detail:"不需要防呆機制、不需要製作圖文並茂的操作手冊、更不需要排解新手問題。當腳本報錯時，自己看著終端機印出的 50 行 Call Stack 就能精準定位問題。",codeBadge:"報錯直接 Throw 原始例外，不需設計親切的錯誤回饋 UI。"}],rightPoints:[{id:"c1",title:"各部門",pairId:"p1",summary:"面對產線、財務、倉管、業務不同角色，需具備多租戶與權限隔離",detail:"公司的工具不是給工程師自己玩的，而是要給財務、廠區品管、人資與業務使用。大家對 IT 的熟悉度天差地遠，系統必須具備直覺的防呆、完整的角色權限控管（RBAC）、多語系介面與操作日誌稽核。",codeBadge:"RBAC 權限分級、嚴格資料防呆、多語系支援與跨部門使用導覽。"},{id:"c2",title:"穩定性",pairId:"c2",summary:"嚴格落實 7x24 高可用、資安審計、資料備份與向下相容",detail:"一旦全公司業務仰賴該系統，工廠生產期間不應斷線。必須抵禦 Prompt Injection 注入攻擊、做好身分驗證（SSO）、限制存取頻率（Rate Limiting），並具備自動備援機制。",codeBadge:"SOC2 / ISO27001 資安規範、定期快照備份、灰度部署與日誌追蹤。"},{id:"c3",title:"維運成本",pairId:"c3",summary:"伺服器資源負載、人員培訓、技術債與長年維護的沉重負擔",detail:"當全公司數百人天天仰賴系統作業，伺服器資源負載與連線穩定度能否持續支撐？初期用 AI 快速拼湊的義大利麵代碼，半年後若原作者離職，誰來為累積的技術債買單？這才是長期維運的硬仗。",codeBadge:"伺服器負載平衡、架構重構、DevOps 監控告警與維運 SOP。"}],auditTitle:"公司內部導入準備度檢核表 (Enterprise Readiness Audit)",auditDesc:"勾選以下各項指標，檢視您的 AI/自動化方案是否已具備跨部門導入的成熟度：",auditItems:["已串接企業單一簽入 (SSO / Azure AD)，支援離職帳號即時收回權限","具備細緻的角色權限控管 (RBAC)，財務與人事機密資料嚴格隔離","有明確的 SLA 與伺服器容錯備援，核心業務不因單點故障而停擺","產出具備確定性與 Schema 驗證，並通過公司資安長 (CISO) 審查","已編寫跨部門操作指引，並具備技術債治理與版本維護專責團隊"],auditScoreLabel:"導入成熟度評分",auditStatusReady:"已達到跨部門上線水準，可進入長久維運階段！",auditStatusDraft:"目前仍偏向「個人/部門原型」，直接推行恐引發維運災難。"},s3:{title:"兩段距離",subtitle:"最終還是要回歸軟體工程與產品本身的本質",node1:"想法",node2:"雛形",node3:"經得起考驗",seg1Badge:"大幅拉近 ✓",seg2BadgeTop:"長久運作",seg2BadgeBottom:"軟體工程與產品本質",stage1Desc:"在生成式 AI 與低代碼工具的賦能下，從「個人想法」到做出生動的「可運行雛形 (Demo/MVP)」的距離被徹底壓縮。過去需要前端、後端刻兩週的原型，現在只要一段精準提示詞或幾小時就能看到介面跑起來。這常讓人產生「做系統很簡單」的假象。",stage2Desc:"然而，從會動的「雛形」到能讓公司全體部門「長久運作、經得起考驗」的真正系統，中間這段漫長巨大的橘色距離沒有任何捷徑！真實商業運作的嚴苛邊界條件、權限合規、高可用架構與技術債管理，依然需要扎扎實實的軟體工程與產品思維才能跨越。",milestonesTitle:"跨越第二段距離的 6 道企業軟體工程關卡（點擊檢視）：",milestones:[{num:"01",title:"異常與邊界條件處理",sub:"Edge Cases & Exception Resilience",desc:"原型通常只示範順利的 Happy Path。但在全公司真實環境中，80% 的代碼都在防禦網路抖動、逾時重試、空資料及惡意惡意字串輸入。"},{num:"02",title:"權限管控與跨部門資安",sub:"RBAC, SSO, Audit Logs & Privacy",desc:"整合企業 AD/LDAP 單一簽入。嚴格劃分產線、財務、人資的資料存取界線，並完整記錄日誌以符合外部法規與資安稽核要求。"},{num:"03",title:"既有系統無縫對接",sub:"ERP, MES, WMS & Legacy Systems",desc:"企業很少能從零起步。新工具必須能安全呼叫內部舊版 SAP、Oracle 或自研 MES 系統的資料庫，並維持資料交易的 ACID 嚴格一致性。"},{num:"04",title:"高併發與離線網路容錯",sub:"Concurrency, Factory Outage & Failover",desc:"月結高峰或廠區斷網時系統是否能頂住？必須實作離線快取緩衝、資料庫連線池調校與自動降級退場機制。"},{num:"05",title:"使用者習慣與變更管理",sub:"Change Management & Department Training",desc:"各部門抗拒改變是常態。必須設計友善的漸進式引導、無障礙提示、並設立專屬的業務 SOP，讓員工覺得被賦能而非被找麻煩。"},{num:"06",title:"長期維護與技術債治理",sub:"DevOps, Observability & Technical Debt",desc:"AI 快速產生的代碼往往缺乏模組化。需要導入嚴格的單元測試、CI/CD 自動化部署、APM 效能監控與高負載熔斷保護機制。"}]}},en:{langName:"English",topTag:"05 / 06 Perspectives on the AI Hype",modeSlide:"Slide Presentation",modeDashboard:"Full Dashboard",navSlides:[{id:0,label:"01. Choosing Tools"},{id:1,label:"02. Individual VS Company"},{id:2,label:"03. The Two Distances"}],s1:{title:"What We Care About When Choosing Tools",notCareBadge:"Just Another Button",notCareAlertTitle:'Why Enterprises Do Not Care About "Just Another AI Button"',notCareAlertDesc:'Slapping a standalone "AI Chat Button" in the corner of software adds visual clutter without real value. If employees still have to manually copy data out of ERP/Excel or if the AI output format cannot plug into existing pipelines, that extra button generates window-switching fatigue rather than productivity.',subtitle:"And how much effort it actually saves us after switching.",cards:[{id:"stability",title:"Stability",shortDesc:"Deterministic outputs, predictable SLA, zero random hallucinations or crashes",detailTitle:"Enterprise-Grade Reliability & SLA Predictability",detailBody:'In company operations, a tool that is "occasionally genius but frequently erratic" is more dangerous than manual labor. Enterprises demand deterministic schema validation, automated graceful fallbacks, and guaranteed prompt stability when underlying models update.',metrics:[{label:"Schema Validation Consistency",value:99},{label:"Edge-Case Exception Handling",value:94},{label:"Guaranteed Uptime (SLA)",value:99.9}],checklist:["Does it have automated retry on connection jitter or timeout?","Is the output strictly enforced by JSON Schema validators?","Are model updates protected by canary releases and rollbacks?"]},{id:"workflow",title:"Workflow Integration",shortDesc:"Frictionless embedding into ERP, MES, internal chat, and approvals",detailTitle:"Zero-Friction Context Integration",detailBody:"The highest-value tools are invisible inside the existing flow. If adopting a tool requires exporting CSVs, manual sanitization, pasting into a chat prompt, and importing back, the friction will kill company adoption immediately.",metrics:[{label:"Legacy API Compatibility",value:92},{label:"Zero Window-Switching Rate",value:89},{label:"Cross-Department Flow Efficiency",value:95}],checklist:["Does it embed directly into existing Teams/Slack, ERP, or internal ticketing?","Does it integrate with corporate identity (SSO / Azure AD / LDAP)?","Does data travel securely inside private VPCs without manual copy-pasting?"]},{id:"effort",title:"Effort Saved",shortDesc:"Net hours and cognitive load saved after subtracting verification & prompt fixes",detailTitle:"True ROI: Net Cross-Department Effort Saved",detailBody:"Do not measure a tool merely by the seconds it takes to generate a draft. You must subtract the time spent prompt-crafting, line-by-line verification, reformatting, and debugging glue code. Real tools reduce genuine cognitive strain.",metrics:[{label:"Manual Verification Reduction",value:87},{label:"Cognitive Strain Reduction",value:91},{label:"Cross-Team Turnaround Speed",value:86}],checklist:["Does staff spend less than 30% of original time reviewing AI results?","Can non-technical teammates onboard effectively within hours?","Does IT avoid drowning in support tickets after deployment?"]}],calcBtn:"Open Department Effort Calculator",calcTitle:"Cross-Department Effort & ROI Calculator",calcUsers:"Number of Staff Using the Tool",calcHours:"Weekly Hours Spent per Person on this Task",calcEfficiency:"Estimated Time-Saving Rate with Tool",calcHourlyCost:"Average Hourly Labor Cost (USD/hr)",calcWeeklyHoursSaved:"Total Department Hours Saved / Week",calcMonthlyDollarSaved:"Estimated Monthly Cost Saved",calcUnitHours:"hrs/wk",calcUnitPeople:"staff",calcVerdictGood:"✅ High Impact: Significant productivity and mental bandwidth freed for the enterprise!",calcVerdictLow:"⚠️ Low ROI: Saved effort does not justify integration and cross-department overhead."},s2:{title:"Individual VS Company",leftHeader:"Individual",rightHeader:"Company",vsBadge:"VS",subtitle:"The real tough battle of maintenance costs and long-term operations.",scenarioPrompt:"Click any pair below to inspect the architectural rift between personal hacks and enterprise systems:",leftPoints:[{id:"p1",title:"Solve Pain Points",pairId:"c1",summary:"Solves immediate personal bottleneck; as long as it runs once, it wins",detail:"When building for yourself, you only care about automating your own specific task today. You never have to worry if other departments input full-width symbols or strange characters, because you are the sole user.",codeBadge:"Hardcoded local paths and personal API keys—quick and dirty."},{id:"p2",title:"Cutting-Edge Tools",pairId:"c2",summary:"Adopt bleeding-edge models and alpha libraries without procurement red tape",detail:"If an experimental open-source model drops on GitHub tonight, you can use it right away. If the API breaks next week, you simply patch two lines in your local script without filing security compliance tickets.",codeBadge:"Freely install npm / pip nightly builds and 0.0.1-alpha packages."},{id:"p3",title:"No Need to Please",pairId:"c3",summary:"Ugly UI or raw terminal scripts are fine; only you need to understand it",detail:"Zero need for defensive guardrails, glossy onboarding guides, or customer support. When your script crashes, you read the 50-line terminal stack trace and fix it yourself in minutes.",codeBadge:"Throws unhandled exceptions directly into terminal; self-diagnosed."}],rightPoints:[{id:"c1",title:"All Departments",pairId:"p1",summary:"Serves factory, accounting, HR, and sales with strict RBAC and multi-tenancy",detail:"Company systems must support hundreds of employees with drastically varying technical literacy. It requires foolproof validation, fine-grained Role-Based Access Control (RBAC), multi-language support, and audit logs.",codeBadge:"Granular RBAC, foolproof inputs, localization, and department onboarding."},{id:"c2",title:"Strict Stability",pairId:"c2",summary:"Upholds 24/7 SLA, security audits, disaster backups, and backward compatibility",detail:"Once cross-department workflows depend on the tool, downtime during factory production hours is unacceptable. You must safeguard against prompt injection, enforce SSO authentication, rate-limit traffic, and maintain automated failovers.",codeBadge:"SOC2 / ISO27001 standards, automated backups, canary deploys & traces."},{id:"c3",title:"Maintenance Cost",pairId:"c3",summary:"Infrastructure resources, staff training, technical debt, and long-term DevOps overhead",detail:"When hundreds of employees rely on the system daily, will server resources and infrastructure hold up? If AI-generated spaghetti code was shipped six months ago and the original creator left, who pays for the mounting technical debt? That is the real battle of long-term operations.",codeBadge:"Load balancing, code refactoring, APM alerting, and DevOps maintenance SOP."}],auditTitle:"Enterprise Adoption Readiness Audit",auditDesc:"Check the requirements below to verify if your automation solution is mature enough for company rollout:",auditItems:["Integrated with Corporate SSO (Azure AD / Okta) with immediate de-provisioning","Fine-grained RBAC separating sensitive financial & HR records from other departments","Explicit 99.9% SLA and high-availability failover across multiple nodes","Deterministic output validation approved by corporate Information Security (CISO)","Comprehensive SOP documentation and a dedicated team for ongoing DevOps maintenance"],auditScoreLabel:"Adoption Readiness Score",auditStatusReady:"Enterprise Ready: Fully prepared for cross-department long-term operations!",auditStatusDraft:"Prototype Stage: Pushing this to all departments will trigger severe operational chaos."},s3:{title:"The Two Distances",subtitle:"Ultimately, it must return to the essence of software engineering and the product itself.",node1:"Idea",node2:"Prototype",node3:"Battle-Tested",seg1Badge:"Drastically Shortened ✓",seg2BadgeTop:"Long-Term Operation",seg2BadgeBottom:"Software Engineering & Core System Essence",stage1Desc:'Powered by generative AI and modern frameworks, the first distance—from "Idea" to a working "Prototype"—has compressed remarkably. Prototypes that used to require two weeks of manual coding can now be generated in a couple of hours, fostering the dangerous illusion that enterprise software is easy.',stage2Desc:'However, the second distance—from a flashy "Prototype" to a "Battle-Tested System" that runs reliably across all company departments—has no shortcuts! Real-world constraints, edge-case resilience, legacy system hooks, security audits, and technical debt still demand rigorous software engineering.',milestonesTitle:"6 Enterprise Engineering Checkpoints Across the Second Distance (Click to inspect):",milestones:[{num:"01",title:"Edge Cases & Exception Resilience",sub:"Beyond the Happy Path",desc:"Prototypes only demo happy paths. In production across all departments, 80% of code handles network timeouts, malformed inputs, race conditions, and graceful degradations."},{num:"02",title:"RBAC, SSO, Audit Logs & Security",sub:"Departmental Data Governance",desc:"Hook into Active Directory. Strictly isolate financial and HR datasets from unauthorized personnel, while keeping immutable audit logs for regulatory compliance."},{num:"03",title:"ERP, MES & Legacy Integration",sub:"Connecting the Enterprise Backbone",desc:"Enterprises do not run on greenfield tech. New tools must reliably communicate with legacy SAP, Oracle, or on-prem factory MES systems while guaranteeing transactional consistency."},{num:"04",title:"Concurrency, Factory Outage & Failover",sub:"Operational Resilience",desc:"When hundreds of workers submit month-end batches simultaneously or factory Wi-Fi drops, the system must buffer changes offline, queue requests, and recover gracefully."},{num:"05",title:"Change Management & Department Training",sub:"User Adoption & Human Factors",desc:"Employee inertia is high. Tools need intuitive guardrails, in-app error feedback, and executive-backed training so workers feel empowered rather than hindered."},{num:"06",title:"DevOps, Observability & Technical Debt",sub:"Total Cost of Ownership",desc:"Vibe-coded AI prototypes degrade rapidly. Long-term operations demand automated CI/CD pipelines, APM tracing, overload circuit breakers, and disciplined code refactoring."}]}},vi:{langName:"Tiếng Việt",topTag:"05 / 06 Góc Nhìn Về Cơn Sốt AI",modeSlide:"Chế Độ Trình Chiếu",modeDashboard:"Bảng Điều Khiển Toàn Cảnh",navSlides:[{id:0,label:"01. Chọn Công Cụ"},{id:1,label:"02. Cá Nhân VS Công Ty"},{id:2,label:"03. Hai Khoảng Cách"}],s1:{title:"Điều Quan Trọng Khi Chọn Công Cụ",notCareBadge:"Thêm Một Nút Bấm",notCareAlertTitle:'Tại sao doanh nghiệp không cần "Chỉ Thêm Một Nút Bấm AI"?',notCareAlertDesc:'Gắn thêm một "nút bấm AI" riêng lẻ ở góc màn hình thường chỉ làm tăng sự xao nhãng. Nếu nhân viên vẫn phải tự copy dữ liệu từ ERP/Excel sang hoặc định dạng trả về không thể kết nối vào hệ thống cũ, nút bấm đó chỉ gây mệt mỏi khi chuyển đổi cửa sổ chứ không đem lại năng suất thật sự.',subtitle:"Và thực sự tiết kiệm được bao nhiêu công sức sau khi chuyển đổi.",cards:[{id:"stability",title:"Độ ổn định",shortDesc:"Chất lượng đầu ra nhất quán, SLA cam kết cao, không sập bất thường hay ảo giác",detailTitle:"Độ Tin Cậy Doanh Nghiệp & Cam Kết Dịch Vụ (SLA)",detailBody:'Trong vận hành công ty, một công cụ "lúc thì xuất sắc, lúc lại lỗi tùm lum" còn nguy hiểm hơn là làm thủ công. Doanh nghiệp cần cấu trúc đầu ra có thể dự đoán (Deterministic Schema), cơ chế tự phục hồi lỗi rõ ràng và sự ổn định của Prompt khi mô hình AI cập nhật.',metrics:[{label:"Tính nhất quán cấu trúc Schema",value:99},{label:"Xử lý ngoại lệ & biên giới hạn",value:94},{label:"Cam kết thời gian hoạt động (SLA)",value:99.9}],checklist:["Có cơ chế tự động thử lại (Retry) khi mạng chập chờn hoặc quá thời gian?","Kết quả đầu ra có được kiểm tra nghiêm ngặt bằng JSON Schema?","Khi cập nhật mô hình có kế hoạch thử nghiệm song song (Canary) và quay lui?"]},{id:"workflow",title:"Tích hợp quy trình",shortDesc:"Hòa nhập mượt mà vào ERP, MES, kênh chat nội bộ và luồng phê duyệt",detailTitle:"Tích Hợp Quy Trình Không Ma Sát",detailBody:'Công cụ có giá trị nhất là công cụ "tàng hình" trong công việc hàng ngày. Nếu để dùng công cụ mới mà phải xuất file từ phân xưởng hay kế toán ra CSV, xóa thông tin nhạy cảm, dán vào khung chat rồi copy ngược lại, tỷ lệ ứng dụng của các phòng ban sẽ bằng không.',metrics:[{label:"Tương thích API hệ thống cũ",value:92},{label:"Tỷ lệ không cần đổi cửa sổ",value:89},{label:"Luồng phối hợp liên phòng ban",value:95}],checklist:["Có tích hợp trực tiếp vào Teams/Slack, ERP hoặc hệ thống ticket nội bộ?","Có hỗ trợ đăng nhập một lần của công ty (SSO / Azure AD / LDAP)?","Dữ liệu có truyền an toàn trong mạng nội bộ VPC mà không cần copy thủ công?"]},{id:"effort",title:"Tiết kiệm công sức",shortDesc:"Thời gian ròng tiết kiệm được sau khi trừ đi công kiểm tra, sửa câu lệnh và bảo trì",detailTitle:"ROI Thực Tế: Công Sức Ròng Tiết Kiệm Liên Phòng Ban",detailBody:"Đừng chỉ nhìn vào vài giây tạo bản nháp đầu tiên của AI. Hãy trừ đi thời gian viết câu lệnh, đọc soát tính chính xác của nghiệp vụ, chỉnh sửa định dạng và bảo trì mã lệnh của đội IT. Công cụ giảm bớt gánh nặng nhận thức thật sự mới đáng đầu tư.",metrics:[{label:"Giảm thời gian rà soát thủ công",value:87},{label:"Giảm tải nhận thức & thao tác",value:91},{label:"Tốc độ hoàn thành giữa các nhóm",value:86}],checklist:["Thời gian nhân viên kiểm tra lại kết quả có ít hơn 30% so với làm thủ công?","Nhân sự mới của các phòng ban có thể làm quen chỉ trong vài giờ?","Sau khi triển khai, bộ phận IT có tránh được việc bị ngập trong khiếu nại?"]}],calcBtn:"Mở Máy Tính Tiết Kiệm Công Sức",calcTitle:"Máy Tính ROI & Tiết Kiệm Công Sức Liên Phòng Ban",calcUsers:"Số Nhân Sự Áp Dụng Công Cụ",calcHours:"Số Giờ Mỗi Người Làm Tác Vụ Này Hàng Tuần",calcEfficiency:"Tỷ Lệ Tiết Kiệm Thời Gian Ước Tính",calcHourlyCost:"Chi Phí Lương Trung Bình (USD/giờ)",calcWeeklyHoursSaved:"Tổng Giờ Tiết Kiệm Toàn Bộ Phận / Tuần",calcMonthlyDollarSaved:"Chi Phí Tiết Kiệm Cho Công Ty Hàng Tháng",calcUnitHours:"giờ/tuần",calcUnitPeople:"người",calcVerdictGood:"✅ Hiệu quả vượt trội: Giải phóng khối lượng lớn thời gian và năng lực cho tổ chức!",calcVerdictLow:"⚠️ Hiệu quả thấp: Thời gian tiết kiệm chưa bù đắp được chi phí tích hợp và đào tạo."},s2:{title:"Cá Nhân VS Công Ty",leftHeader:"Cá Nhân",rightHeader:"Công Ty",vsBadge:"VS",subtitle:"Trận chiến thực sự về chi phí bảo trì và vận hành lâu dài giữa các phòng ban.",scenarioPrompt:"Nhấp vào từng cặp để thấy rõ hố sâu kiến trúc giữa kịch bản tự làm và hệ thống doanh nghiệp:",leftPoints:[{id:"p1",title:"Giải quyết điểm đau",pairId:"c1",summary:"Chỉ cần giải quyết đúng nút thắt của mình, chạy được là coi như thắng",detail:"Khi tự làm cho mình, bạn chỉ cần tự động hóa xong việc của buổi chiều nay. Bạn không cần bận tâm nếu người khác nhập ký tự lạ hay sai định dạng, vì người duy nhất sử dụng là chính bạn.",codeBadge:"Gán cứng đường dẫn máy cá nhân và API Key—nhanh gọn và chạy được ngay."},{id:"p2",title:"Công cụ mạnh nhất",pairId:"c2",summary:"Thoải mái thử nghiệm mô hình mới nhất mà không cần xin phê duyệt quy trình",detail:"Hôm nay có mô hình mã nguồn mở hay thư viện mới phát hành, bạn có thể áp dụng vào script ngay. Nếu tuần sau thư viện đổi API, bạn chỉ mất vài phút tự sửa lại code mà không cần qua kiểm toán an ninh.",codeBadge:"Cài đặt tự do các bản thử nghiệm nightly hoặc v0.0.1-alpha."},{id:"p3",title:"Không cần chiều lòng ai",pairId:"c3",summary:"Giao diện xấu xí hay chạy màn hình đen Terminal đều tốt, mình hiểu là được",detail:"Không cần cơ chế chống thao tác sai, không cần viết cẩm nang hướng dẫn hay hỗ trợ người dùng. Khi script báo lỗi, bạn tự đọc màn hình dòng lệnh và tự chỉnh trong chốc lát.",codeBadge:"In thẳng lỗi gốc ra Terminal; người viết tự hiểu và tự sửa."}],rightPoints:[{id:"c1",title:"Các phòng ban",pairId:"p1",summary:"Phục vụ xưởng sản xuất, kế toán, nhân sự, kinh doanh với phân quyền chặt chẽ",detail:"Hệ thống công ty phải phục vụ hàng trăm nhân sự với trình độ công nghệ khác nhau. Cần có giao diện chống nhập sai, phân quyền vai trò (RBAC) nghiêm ngặt, đa ngôn ngữ và nhật ký kiểm toán.",codeBadge:"Phân quyền RBAC, kiểm tra dữ liệu đầu vào, đa ngôn ngữ & tài liệu đào tạo."},{id:"c2",title:"Tính ổn định",pairId:"c2",summary:"Đảm bảo hoạt động 24/7, kiểm toán an ninh mạng, sao lưu dữ liệu và tương thích ngược",detail:"Khi quy trình của các phòng ban phụ thuộc vào hệ thống, không được phép mất kết nối trong thời gian nhà máy sản xuất. Phải phòng chống tấn công Prompt Injection, tích hợp SSO, giới hạn lưu lượng và có máy chủ dự phòng.",codeBadge:"Chuẩn bảo mật SOC2/ISO, sao lưu định kỳ, cập nhật theo lô & giám sát log."},{id:"c3",title:"Chi phí vận hành",pairId:"c3",summary:"Tài nguyên máy chủ, chi phí đào tạo nhân sự, nợ kỹ thuật và gánh nặng bảo trì dài hạn",detail:"Khi hàng trăm nhân viên sử dụng hệ thống mỗi ngày, tài nguyên máy chủ và đường truyền có chịu tải nổi không? Đoạn code AI sinh vội 6 tháng trước, nếu người tạo nghỉ việc thì ai gánh món nợ kỹ thuật này? Đó mới là cuộc chiến dài hạn.",codeBadge:"Cân bằng tải máy chủ, tái cấu trúc mã nguồn, cảnh báo APM và quy trình SOP."}],auditTitle:"Bảng Kiểm Tra Độ Sẵn Sàng Triển Khai Doanh Nghiệp",auditDesc:"Đánh dấu các tiêu chí dưới đây để xem giải pháp của bạn đã sẵn sàng cho toàn công ty hay chưa:",auditItems:["Đã kết nối với hệ thống đăng nhập doanh nghiệp (SSO / Azure AD), thu hồi tài khoản tức thì","Phân quyền chi tiết (RBAC) tách biệt dữ liệu nhạy cảm của Kế toán & Nhân sự với bên ngoài","Cam kết SLA 99.9% và có phương án dự phòng khi máy chủ hoặc đường truyền gặp sự cố","Kết quả đầu ra có cấu trúc chuẩn xác và đã được bộ phận An Toàn Thông Tin duyệt","Có tài liệu quy trình thao tác chuẩn (SOP) và đội ngũ chuyên trách bảo trì mã nguồn lâu dài"],auditScoreLabel:"Điểm Sẵn Sàng Doanh Nghiệp",auditStatusReady:"Đã sẵn sàng cho doanh nghiệp: Đủ tiêu chuẩn vận hành lâu dài giữa các phòng ban!",auditStatusDraft:"Giai đoạn thử nghiệm: Nếu triển khai ngay cho toàn công ty sẽ gây rủi ro lớn."},s3:{title:"Hai Khoảng Cách",subtitle:"Cuối cùng vẫn phải quay về bản chất của kỹ thuật phần mềm và chính hệ thống đó.",node1:"Ý tưởng",node2:"Nguyên mẫu",node3:"Vững vàng trước thử thách",seg1Badge:"Rút ngắn đáng kể ✓",seg2BadgeTop:"Vận hành lâu dài",seg2BadgeBottom:"Bản chất Kỹ thuật Phần mềm & Hệ thống",stage1Desc:'Nhờ AI tạo sinh và các công cụ lập trình hiện đại, khoảng cách đầu tiên từ "Ý tưởng" đến "Nguyên mẫu (Demo/MVP) có thể chạy được" đã được rút ngắn ngoạn mục. Trước đây cần 2 tuần viết code thì nay chỉ mất vài giờ, tạo ra ảo tưởng rằng làm hệ thống doanh nghiệp rất dễ dàng.',stage2Desc:'Tuy nhiên, khoảng cách thứ hai—từ "Nguyên mẫu" hào nhoáng đến một "Hệ thống vững vàng, vận hành lâu dài" cho toàn bộ các phòng ban trong công ty—không hề có đường tắt! Các giới hạn thực tế, an ninh phân quyền, kết nối ERP cũ và xử lý nợ kỹ thuật vẫn đòi hỏi tư duy kỹ thuật phần mềm vững chắc.',milestonesTitle:"6 Cột Mốc Kỹ Thuật Doanh Nghiệp Cần Vượt Qua Ở Khoảng Cách Thứ Hai (Nhấp để xem):",milestones:[{num:"01",title:"Xử lý ngoại lệ & trường hợp biên",sub:"Vượt ra ngoài luồng chạy êm đềm",desc:"Bản nguyên mẫu chỉ biểu diễn khi mọi thứ hoàn hảo. Trong môi trường công ty, 80% mã lệnh là để chống chịu rớt mạng, hết thời gian chờ, dữ liệu trống và thao tác bất cẩn."},{num:"02",title:"Phân quyền RBAC & an ninh phòng ban",sub:"Quản trị dữ liệu liên phòng ban",desc:"Kết nối hệ thống Active Directory. Phân định ranh giới dữ liệu giữa phân xưởng, kế toán và nhân sự, đồng thời lưu nhật ký kiểm toán không thể chỉnh sửa."},{num:"03",title:"Kết nối hệ thống cũ ERP / MES",sub:"Gắn kết xương sống doanh nghiệp",desc:"Công ty hiếm khi xây dựng từ con số 0. Công cụ mới phải giao tiếp an toàn với cơ sở dữ liệu SAP, Oracle hoặc phần mềm sản xuất MES sẵn có và bảo đảm tính toàn vẹn dữ liệu."},{num:"04",title:"Tải cao & mạng chập chờn phân xưởng",sub:"Khả năng phục hồi hoạt động",desc:"Khi hàng trăm nhân viên chốt sổ cuối tháng hoặc mạng xưởng bị ngắt, hệ thống phải lưu đệm cục bộ, xếp hàng xử lý và tự động phục hồi khi có mạng trở lại."},{num:"05",title:"Đào tạo & quản trị sự thay đổi",sub:"Yếu tố con người & sự đón nhận",desc:"Tâm lý ngại thay đổi ở các phòng ban là bình thường. Cần có hướng dẫn từng bước trực quan và quy trình SOP rõ ràng để nhân viên cảm thấy được hỗ trợ thay vì thêm việc."},{num:"06",title:"DevOps & xử lý nợ kỹ thuật dài hạn",sub:"Tổng chi phí sở hữu hệ thống (TCO)",desc:"Mã nguồn do AI sinh nhanh rất dễ bị hỗn loạn. Vận hành lâu dài đòi hỏi quy trình kiểm thử tự động CI/CD, theo dõi hiệu năng APM và tái cấu trúc mã nguồn có kỷ luật."}]}}};function Mn(){let[e,a]=(0,ce.useState)("zh-TW"),[t,o]=(0,ce.useState)("slide"),[l,r]=(0,ce.useState)(0),[u,n]=(0,ce.useState)("stability"),[s,f]=(0,ce.useState)(!1),[h,g]=(0,ce.useState)(!1),[m,I]=(0,ce.useState)(15),[C,S]=(0,ce.useState)(6),[E,c]=(0,ce.useState)(50),[i,p]=(0,ce.useState)(25),[L,v]=(0,ce.useState)(0),[w,P]=(0,ce.useState)([!0,!0,!1,!0,!1]),[D,N]=(0,ce.useState)(30),[B,Te]=(0,ce.useState)(0),k=An[e]||An["zh-TW"],No=Math.round(m*C*(E/100)),Kf=Math.round(No*i*4.3),Qf=w.filter(Boolean).length,Oo=Math.round(Qf/w.length*100),$f=(R,T)=>(0,d.jsxs)("div",{className:`w-16 h-16 rounded-full flex items-center justify-center transition-all duration-300 border ${T?"bg-orange-500/20 border-orange-400 shadow-[0_0_30px_rgba(249,115,22,0.6)] scale-110 ring-2 ring-orange-500/30":"bg-zinc-800/90 border-orange-500/40 shadow-[0_0_15px_rgba(249,115,22,0.2)] hover:border-orange-400"}`,children:[R==="bricks"&&(0,d.jsx)(yo,{className:"w-7 h-7 text-orange-400"}),R==="link"&&(0,d.jsx)(Ao,{className:"w-7 h-7 text-zinc-200"}),R==="timer"&&(0,d.jsx)(To,{className:"w-7 h-7 text-zinc-200"})]}),Bn=()=>{let R=k.s1.cards.find(T=>T.id===u)||k.s1.cards[0];return(0,d.jsxs)("section",{className:"bg-[#18191e
