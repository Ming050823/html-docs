<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>API 是什麼？ · What is an API? · API là gì?</title>
<style>
  :root {
    --bg: #f6f0e6;
    --bg-2: #fffaf3;
    --ink: #2c241c;
    --muted: #6e6256;
    --line: #e4d8c8;
    --green: #3f6b4e;
    --green-soft: #e7f0e6;
    --orange: #c46a32;
    --orange-soft: #fde8d8;
    --blue: #3d6488;
    --blue-soft: #e5eef6;
    --gold: #c9a15b;
    --shadow: 0 10px 30px rgba(70, 48, 24, 0.08);
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", "Noto Sans", sans-serif;
    background:
      radial-gradient(900px 420px at 10% -10%, #fbe7cf 0%, transparent 60%),
      radial-gradient(800px 380px at 100% 0%, #e5f0e4 0%, transparent 55%),
      var(--bg);
    color: var(--ink);
    line-height: 1.65;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 18px 64px; }
  header {
    display: flex; justify-content: space-between; gap: 16px; align-items: flex-start;
    flex-wrap: wrap; margin-bottom: 18px;
  }
  .eyebrow {
    letter-spacing: .08em; text-transform: uppercase; font-size: 12px;
    color: var(--orange); font-weight: 700; margin: 0 0 6px;
  }
  h1 { font-size: clamp(28px, 4vw, 42px); line-height: 1.2; margin: 0 0 8px; }
  .lead { margin: 0; color: var(--muted); max-width: 62ch; }
  .langs { display: flex; gap: 8px; background: white; padding: 6px; border-radius: 999px; box-shadow: var(--shadow); }
  .langs button {
    border: 0; background: transparent; padding: 8px 14px; border-radius: 999px;
    cursor: pointer; font-weight: 700; color: var(--muted);
  }
  .langs button.active { background: var(--ink); color: white; }
  .card {
    background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 22px; margin-top: 16px;
  }
  h2 { margin: 0 0 8px; font-size: 24px; }
  .q {
    background: var(--orange-soft); border-radius: 14px; padding: 12px 14px; margin: 12px 0;
    font-weight: 650;
  }
  .stage {
    position: relative; min-height: 280px; border-radius: 16px; overflow: hidden;
    background: linear-gradient(#f7e7cf, #f3d7b4 42%, #e7c39a 42%, #edd9bc 100%);
    border: 1px solid var(--line);
  }
  .kitchen {
    position: absolute; right: 0; top: 0; bottom: 38%; width: 34%;
    background: linear-gradient(#f4efe4, #e7e0d2);
    border-left: 8px solid #6d8f72;
  }
  .chef {
    position: absolute; right: 28px; bottom: 18px; font-size: 42px;
  }
  .door {
    position: absolute; right: 34%; top: 18px; bottom: 38%; width: 18px;
    background: #6d8f72; border-radius: 8px 0 0 8px;
  }
  .table {
    position: absolute; left: 8%; bottom: 18px; width: 34%; height: 18px;
    background: #c9844a; border-radius: 8px;
  }
  .person { position: absolute; font-size: 46px; transition: transform .6s ease; }
  .customer { left: 12%; bottom: 34px; }
  .waiter { left: 42%; bottom: 46px; }
  .waiter.go { transform: translateX(150px); }
  .envelope {
    position: absolute; left: 24%; bottom: 120px; background: white; border-radius: 12px;
    padding: 6px 10px; font-size: 13px; box-shadow: var(--shadow); opacity: 0;
    transition: all .7s ease; max-width: 180px;
  }
  .envelope.show { opacity: 1; }
  .envelope.to-kitchen { left: 68%; bottom: 150px; }
  .envelope.back { left: 28%; bottom: 130px; background: #fff6ea; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  button.action, button.ghost {
    border: 0; border-radius: 999px; padding: 10px 14px; cursor: pointer; font-weight: 700;
  }
  button.action { background: var(--green); color: white; }
  button.ghost { background: white; color: var(--ink); border: 1px solid var(--line); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .log {
    margin-top: 12px; background: white; border-radius: 12px; padding: 12px 14px;
    border: 1px dashed var(--line); min-height: 72px;
  }
  .log b { color: var(--green); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .app {
    text-align: left; background: white; border: 1px solid var(--line); border-radius: 16px;
    padding: 14px; cursor: pointer; transition: transform .15s ease, border-color .15s;
  }
  .app:hover, .app.open { transform: translateY(-2px); border-color: var(--green); }
  .app .icon { font-size: 28px; }
  .app h3 { margin: 6px 0 4px; font-size: 17px; }
  .app p { margin: 0; color: var(--muted); font-size: 14px; }
  .detail {
    display: none; margin-top: 10px; background: var(--green-soft); border-radius: 10px; padding: 8px 10px;
    color: var(--ink); font-size: 14px;
  }
  .app.open .detail { display: block; }
  .plug-row { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .outlet {
    width: 92px; height: 92px; border-radius: 16px; background: #f4efe6; border: 1px solid var(--line);
    display: grid; place-items: center; box-shadow: inset 0 0 0 8px white;
  }
  .holes { display: flex; gap: 10px; }
  .holes span { width: 10px; height: 24px; background: #2c241c; border-radius: 4px; }
  .lamp {
    width: 120px; text-align: center; cursor: pointer; user-select: none;
  }
  .bulb {
    width: 54px; height: 54px; margin: 0 auto 6px; border-radius: 50% 50% 46% 46%;
    background: #d9d3c7; transition: all .3s ease;
  }
  .lamp.on .bulb {
    background: #ffe08a; box-shadow: 0 0 30px #ffd15a;
  }
  .steps { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 0; }
  .step {
    flex: 1; min-width: 140px; background: white; border-radius: 12px; padding: 10px;
    border: 1px solid var(--line); font-size: 14px;
  }
  .step strong { display: block; color: var(--orange); }
  .quiz button { margin: 4px 6px 0 0; }
  .quiz .result { margin-top: 10px; font-weight: 700; }
  .ok { color: var(--green); }
  .no { color: var(--orange); }
  footer { margin-top: 22px; color: var(--muted); font-size: 14px; }
  .map { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .pill { background: white; border-radius: 999px; padding: 6px 10px; border: 1px solid var(--line); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="title"></h1>
      <p class="lead" id="lead"></p>
    </div>
    <div class="langs" role="tablist">
      <button type="button" data-lang="zh" class="active">中文</button>
      <button type="button" data-lang="en">English</button>
      <button type="button" data-lang="vi">Tiếng Việt</button>
    </div>
  </header>

  <section class="card">
    <h2 id="s1"></h2>
    <p id="s1p"></p>
    <div class="q" id="s1q"></div>
    <div class="stage" aria-hidden="true">
      <div class="kitchen"><div class="chef">👨‍🍳</div></div>
      <div class="door"></div>
      <div class="table"></div>
      <div class="person customer">🙂</div>
      <div class="person waiter" id="waiter">🧑‍🍳</div>
      <div class="envelope" id="env"></div>
    </div>
    <div class="controls">
      <button class="ghost" type="button" data-dish="noodle" id="d1"></button>
      <button class="ghost" type="button" data-dish="tea" id="d2"></button>
      <button class="ghost" type="button" data-dish="no" id="d3"></button>
      <button class="action" type="button" id="orderBtn"></button>
    </div>
    <div class="log" id="log"></div>
    <div class="map">
      <span class="pill" id="m1"></span>
      <span class="pill" id="m2"></span>
      <span class="pill" id="m3"></span>
    </div>
  </section>

  <section class="card">
    <h2 id="s2"></h2>
    <p id="s2p"></p>
    <div class="plug-row">
      <div class="outlet" title="API"><div class="holes"><span></span><span></span></div></div>
      <div class="lamp" id="lamp">
        <div class="bulb"></div>
        <div id="lampLabel"></div>
      </div>
    </div>
    <div class="steps">
      <div class="step"><strong>1</strong><span id="st1"></span></div>
      <div class="step"><strong>2</strong><span id="st2"></span></div>
      <div class="step"><strong>3</strong><span id="st3"></span></div>
    </div>
  </section>

  <section class="card">
    <h2 id="s3"></h2>
    <p id="s3p"></p>
    <div class="q" id="s3q"></div>
    <div class="grid" id="apps"></div>
  </section>

  <section class="card quiz">
    <h2 id="s4"></h2>
    <p id="s4p"></p>
    <div id="choices"></div>
    <div class="result" id="quizResult"></div>
  </section>

  <footer id="foot"></footer>
</div>
<script>

let lang = "zh";
let dish = "noodle";
let busy = false;

const $ = (id) => document.getElementById(id);

function dishName() {
  const t = I18N[lang];
  if (dish === "tea") return t.d2;
  if (dish === "no") return t.d3;
  return t.d1;
}

function render() {
  const t = I18N[lang];
  document.documentElement.lang = lang === "zh" ? "zh-Hant" : lang === "vi" ? "vi" : "en";
  $("eyebrow").textContent = t.eyebrow;
  $("title").textContent = t.title;
  $("lead").textContent = t.lead;
  $("s1").textContent = t.s1;
  $("s1p").textContent = t.s1p;
  $("s1q").textContent = t.s1q;
  $("d1").textContent = t.d1;
  $("d2").textContent = t.d2;
  $("d3").textContent = t.d3;
  $("orderBtn").textContent = t.order;
  $("m1").textContent = t.m1;
  $("m2").textContent = t.m2;
  $("m3").textContent = t.m3;
  $("s2").textContent = t.s2;
  $("s2p").textContent = t.s2p;
  $("lampLabel").textContent = t.lamp;
  $("st1").textContent = t.st1;
  $("st2").textContent = t.st2;
  $("st3").textContent = t.st3;
  $("s3").textContent = t.s3;
  $("s3p").textContent = t.s3p;
  $("s3q").textContent = t.s3q;
  $("s4").textContent = t.s4;
  $("s4p").textContent = t.s4p;
  $("foot").textContent = t.foot;
  if (!$("log").dataset.locked) $("log").innerHTML = t.log0;
  $("apps").innerHTML = t.apps.map((a, i) =>
    `<button class="app" type="button" data-i="${i}"><div class="icon">${a[0]}</div><h3>${a[1]}</h3><p></p><div class="detail">${a[3] ? "" : a[2]}</div></button>`
  ).join("");
  document.querySelectorAll("#apps .app").forEach((btn) => {
    btn.addEventListener("click", () => btn.classList.toggle("open"));
  });
  $("choices").innerHTML = t.choices.map((c, i) =>
    `<button class="ghost" type="button" data-ok="${c[1]}" data-i="${i}">${c[0]}</button>`
  ).join("");
  $("quizResult").textContent = "";
  document.querySelectorAll("#choices button").forEach((btn) => {
    btn.addEventListener("click", () => {
      const ok = btn.dataset.ok === "true";
      $("quizResult").textContent = ok ? t.yes : t.no;
      $("quizResult").className = "result " + (ok ? "ok" : "no");
    });
  });
  document.querySelectorAll(".langs button").forEach((b) => {
    b.classList.toggle("active", b.dataset.lang === lang);
  });
  markDish();
}

function markDish() {
  document.querySelectorAll("[data-dish]").forEach((b) => {
    b.style.outline = b.dataset.dish === dish ? "2px solid #3f6b4e" : "";
  });
}

async function order() {
  if (busy) return;
  busy = true;
  $("orderBtn").disabled = true;
  const t = I18N[lang];
  const name = dishName();
  const env = $("env");
  const waiter = $("waiter");
  $("log").dataset.locked = "1";
  env.className = "envelope show";
  env.textContent = name;
  $("log").innerHTML = `<b>1.</b> ${t.sent.replace("{dish}", name)}`;
  await wait(700);
  waiter.classList.add("go");
  env.classList.add("to-kitchen");
  $("log").innerHTML = `<b>2.</b> ${t.going}`;
  await wait(900);
  $("log").innerHTML = `<b>3.</b> ${t.back.replace("{dish}", name)}`;
  env.classList.remove("to-kitchen");
  env.classList.add("back");
  waiter.classList.remove("go");
  await wait(800);
  busy = false;
  $("orderBtn").disabled = false;
}

function wait(ms) { return new Promise((r) => setTimeout(r, ms)); }

document.querySelectorAll(".langs button").forEach((b) => {
  b.addEventListener("click", () => { lang = b.dataset.lang; $("log").dataset.locked = ""; render(); });
});
document.querySelectorAll("[data-dish]").forEach((b) => {
  b.addEventListener("click", () => { dish = b.dataset.dish; markDish(); });
});
$("orderBtn").addEventListener("click", order);
$("lamp").addEventListener("click", () => $("lamp").classList.toggle("on"));
render();
</script>
</body>
</html>
